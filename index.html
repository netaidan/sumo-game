<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumo Smash!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sumo <span>Smash!</span></h1>
  </header>

  <section class="scoreboard" aria-live="polite">
    <div class="score p1">
      <span class="emoji">🍅</span>
      <span class="name" id="p1Name" dir="auto">Player 1</span>
      <span class="pips" id="p1Pips"></span>
    </div>
    <div class="vs">first to 3</div>
    <div class="score p2">
      <span class="pips" id="p2Pips"></span>
      <span class="name" id="p2Name" dir="auto">Player 2</span>
      <span class="emoji">🫐</span>
    </div>
  </section>

  <main class="stage">
    <canvas id="game" aria-label="Sumo arena"></canvas>

    <div class="overlay" id="overlay">
      <form class="panel" id="menuPanel" autocomplete="off">
        <h2>Push your rival out of the ring!</h2>
        <p>Build up speed and slam into them. First to win <b>3 rounds</b> wins the match.</p>
        <div class="names">
          <label class="name-field p1">
            <span>🍅 Player 1 Name</span>
            <input id="p1Input" type="text" maxlength="16" dir="auto" placeholder="Player 1" spellcheck="false">
          </label>
          <label class="name-field p2">
            <span>🫐 Player 2 Name</span>
            <input id="p2Input" type="text" maxlength="16" dir="auto" placeholder="Player 2" spellcheck="false">
          </label>
        </div>
        <button id="startBtn" type="submit">Start!</button>
      </form>
      <div class="panel hidden" id="overPanel">
        <h2 id="winnerText">Winner!</h2>
        <p id="finalScore"></p>
        <div class="buttons">
          <button id="againBtn" type="button">Play Again</button>
          <button id="namesBtn" type="button" class="secondary">Change Names</button>
        </div>
      </div>
    </div>
  </main>

  <section class="controls">
    <div class="ctrl p1">
      <h3>🍅 Player 1</h3>
      <div class="keys">
        <div class="row"><kbd>W</kbd></div>
        <div class="row"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      </div>
      <p>Move with <b>WASD</b> · Dash: <kbd class="wide">Space</kbd></p>
    </div>
    <div class="ctrl p2">
      <h3>Player 2 🫐</h3>
      <div class="keys">
        <div class="row"><kbd>↑</kbd></div>
        <div class="row"><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div>
      </div>
      <p>Move with <b>Arrows</b> · Dash: <kbd class="wide">Enter</kbd></p>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
